[build-system]
requires = ["scikit-build-core>=0.8"]
build-backend = "scikit_build_core.build"

[project]
name = "fib-abia-planners"
version = "0.2.0"
description = "FF 2.3 y Metric-FF 2.1 (Jörg Hoffmann) con los ejemplos de planificación de la asignatura ABIA (UPC)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Santiago Marco-Sola", email = "santiago.marco@upc.edu" }]
keywords = ["planning", "pddl", "ff", "metric-ff", "ai"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Education",
  "Natural Language :: Spanish",
]

[project.urls]
Repository = "https://github.com/smarco-fib/fib-abia-planners"
Documentation = "https://github.com/smarco-fib/fib-abia-planners/blob/main/docs/GUIA_ALUMNOS.md"

[project.scripts]
ff = "abia_planners.launcher:ff"
metric-ff = "abia_planners.launcher:metric_ff"
fib-abia-planners = "abia_planners.cli:main"

[tool.scikit-build]
minimum-version = "0.8"
cmake.build-type = "Release"
wheel.py-api = "py3"
wheel.packages = ["python/abia_planners"]
wheel.license-files = ["LICENSE", "NOTICE"]
sdist.exclude = ["build", "corpus", "golden/ipc", "golden/synthetic", "reports/data", ".claude"]

# Wheels are py3-none-<platform>: one build per platform is enough.
[tool.cibuildwheel]
build = "cp312-*"
skip = ["*-win32", "*_i686", "pp*"]
test-command = "fib-abia-planners selftest --all"
build-verbosity = 1

[tool.cibuildwheel.linux]
# manylinux (glibc) and musllinux wheels; musl binaries are fully static
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
environment = { CMAKE_ARGS = "-DABIA_STATIC=ON" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# MinGW-w64 GCC (not MSVC), statically linked: no non-system DLLs
environment = { CMAKE_GENERATOR = "MinGW Makefiles", CC = "gcc", CMAKE_ARGS = "-DABIA_STATIC=ON" }
